name: fork-verify

# Minimal fork-only CI for gascity forks. Verifies WIP feature branches
# WITHOUT upstream's Blacksmith
# self-hosted runners, runner-policy gating, or secrets — none of which a fork
# has. ubuntu-latest compiles the Dolt go-icu-regex CGO dependency cleanly; the
# `unicode/regex.h` build failure is macOS-only (icu4c@78 header layout), so a
# Linux runner is exactly what's needed to get a real green/red signal.
#
# Reuses the upstream composite action .github/actions/setup-gascity-ubuntu so
# the Go + Dolt + native-dependency setup is not re-solved here.

on:
  push:
    branches: ["feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Canonical PR branches already run the complete Blacksmith CI graph.
    # This lightweight fallback exists only for forks that cannot use those
    # runners or repository secrets.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    env:
      DOLT_VERSION: "2.1.7"
      BD_VERSION: "v1.1.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup-gascity-ubuntu
        with:
          dolt-version: ${{ env.DOLT_VERSION }}
          bd-version: ${{ env.BD_VERSION }}
          install-claude-cli: "false"
      - name: Build (compiles the whole tree — catches compile errors the macOS ICU break hides)
        run: go build ./...
      - name: Vet changed package
        run: go vet ./cmd/gc/...
      - name: docs/reference/cli.md matches gc gen-doc (vn-s9oydtn)
        # The file says "do not edit" and nothing else here runs this test, so
        # a changed help string or flag used to merge with a stale page.
        run: go test ./cmd/gc/ -run 'TestCLIDocsFreshness|TestGenDoc' -count=1 -v
      - name: Unit tests — cross-store work delivery
        run: go test ./cmd/gc/ -run 'TestFilterAssignedWorkBeads|TestAssignedWork|TestFirstStoreWithWork|TestCrossStoreClaimDir|TestRunBDForBead|TestGateOpenWorkBounded|TestCrossStorePipeline' -count=1 -v
      - name: Unit tests — cross-store reachability predicate + fail-loud guard
        run: |
          go test ./internal/agentutil/ -run 'TestAgentReachesWorkflowStore|TestAgentIsCrossStoreEligible' -count=1 -v
          go test ./internal/sling/ -run 'TestValidateBuiltInRouteStoreReachableAllowsCityScopedTarget|TestDoSlingRefusesCrossStore' -count=1 -v
      - name: Unit tests, the dispatch budget goes to the most overdue order (hq-ggxthx)
        run: go test ./cmd/gc/ -run 'TestOrderDispatchUrgency|TestOrderDispatchBudget|TestOrderDispatchMissedTurns|TestOrderDispatchRotationResumes|TestOrderDispatchRespectsMaxDispatchesPerTick|TestOrderDispatchMaxDispatchesPerTickConfig|TestOrderDispatchTriggerEnvFailuresRespectMaxDispatchesPerTick' -count=1 -v
      - name: Unit tests — order scope (#2830)
        run: go test ./internal/orders/ -run 'TestParseScope|TestValidateRejectsUnknownScope|TestValidateAcceptsCityAndRigScope|TestParseEnv' -count=1 -v
      - name: Unit tests — scale from zero (#2819)
        run: go test ./cmd/gc/ -run 'TestBuildDesiredState_ScaleFromZero' -count=1 -v
      - name: Unit tests, a fresh pool seat survives its own claim (vn-n5abuk0)
        # The chaos tests are here because they pull a seat out of the desired
        # set and expect a drain, so they are the ones the spawn grace can break.
        run: go test ./cmd/gc/ -run 'TestPoolSpawnGrace|TestPoolSeatInSpawnGrace|TestSessionLifecycleChaosPendingInteraction' -count=1 -v
      - name: Unit tests, the nudge sweep borrows the store and prunes gone shadows (hq-ga1qga)
        # The supervisor tick opened a fresh store every pass for dead-letter
        # rows it could never prune. These pin the borrow, the open gate and
        # the prune, plus the older sweep and open-count tests they sit beside.
        run: go test ./cmd/gc/ -run 'TestPruneDeadQueuedNudges|TestNudgeMaintenanceSkipsStoreOpen|TestRunNudgeQueueMaintenanceSweep|TestNudgePollHelpers' -count=1 -v
      - name: Unit tests, worktree spawn guard and pool-name identity (vn-rm9u8g)
        run: |
          go test ./internal/workdir/ -run 'TestValidateAncestorWorktreesNotStale|TestValidateNotNestedInSessionWorktree|TestValidateSpawnTarget' -count=1 -v
          go test ./internal/config/ -run 'TestValidateSemanticsNamepool|TestValidateSemanticsSameNamepoolNameInTwoRigsIsFine|TestLoadReportsNamepoolCollisionFromDisk' -count=1 -v
      - name: Unit tests, the agent and session lists read each bead store once (hq-xujh6g)
        # The agent list once ran one store query per agent and took 8 minutes
        # on a 419-slot town. These pin one read per store per request.
        run: go test ./internal/api/ -run 'TestAgentList|ActiveBead|TestHandleSessionList|TestSessionList' -count=1 -v
      - name: Unit tests — spawn-storm detector counts resets, not runs (hq-2yztr2)
        run: |
          # The detector is a shell script and needs jq. Say so here rather
          # than letting every row fail for a reason the log does not name.
          jq --version
          go test ./examples/gastown/ -run 'TestSpawnStorm' -count=1 -v

  dashboard:
    # The dashboard gc embeds (internal/api/dashboardspa). `verify` above builds
    # Go only, so without this job a dashboard change could go green with a page
    # that does not typecheck, a failing vitest, or a dist/ that no longer matches
    # its sources. dist/ is what the gc binary actually serves, so a stale one
    # ships the old page with no error anywhere.
    #
    # These are upstream's "Dashboard SPA" checks plus `make dashboard-ci`,
    # without the browser e2e. The job runs on every branch. A red here on a
    # branch that never touched the dashboard means town's own dist/ or API
    # client has drifted from its sources, and that is worth knowing too.
    if: ${{ github.repository != 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install SPA dependencies
        run: npm ci --silent
        working-directory: internal/api/dashboardspa/web
      - name: Vitest
        run: npm run --workspace gas-city-dashboard-frontend test
        working-directory: internal/api/dashboardspa/web
      - name: Typecheck, build, handler tests, and no drift in dist/ or the API client (make dashboard-ci)
        run: make dashboard-ci
